[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "req-tester"
version = "1.0.0"
description = "Утилита автоматизированного тестирования требований с помощью ИИ (OpenAI-совместимый API, модель qwen3.8)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Req Tester" }]
keywords = ["requirements", "testing", "LLM", "openai", "qwen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.0.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
req-tester = "req_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:libtmux"
